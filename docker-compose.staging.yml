services:
  mon-api:
    image: ${IMAGE_BACK}
    restart: unless-stopped
    ports:
      - '12000:8080'
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=${ConnectionStrings__DefaultConnection}
      - JWT__Secret=${JWT__Secret}

  admin-frontend:
    image: ${IMAGE_FRONT}
    restart: unless-stopped
    ports:
      - '80:8080'
    depends_on:
      - mon-api

  mobile-app:
    image: ${IMAGE_MOBILE}
    restart: unless-stopped
    ports:
      - '81:8080'
    depends_on:
      - mon-api
