services:
  mon-api:
    image: ${IMAGE_BACK}
    restart: unless-stopped
    ports:
      - '12000:8080'
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=${ConnectionStrings__DefaultConnection}
      - JWT__Secret=${JWT__Secret}

  admin-frontend:
    image: ${IMAGE_FRONT}
    restart: unless-stopped
    # Injecte l'URL publique de l'API dans le .env (IP de la VM, fournie par le deploy)
    # puis force Vite a ecouter sur 0.0.0.0:8080
    command:
      - sh
      - -c
      - |
        echo "VITE_PUBLIC_API_ROUTE=${VITE_PUBLIC_API_ROUTE}" > .env
        exec npm run dev -- --host 0.0.0.0 --port 8080
    ports:
      - '80:8080'
    depends_on:
      - mon-api

  mobile-app:
    image: ${IMAGE_MOBILE}
    restart: unless-stopped
    # Force Vite a ecouter sur 0.0.0.0:8080 (le mobile ne bind pas 0.0.0.0 par defaut)
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "8080"]
    ports:
      - '81:8080'
    depends_on:
      - mon-api
