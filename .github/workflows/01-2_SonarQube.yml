name: 01-2 - Integration - Sonar

on: workflow_call

jobs:
  QualityBack:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: back-coverage-report
          path: backend/coverage

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install SonarScanner
        run: dotnet tool install --global dotnet-sonarscanner

      - name: SonarQube Begin
        run: >
          dotnet sonarscanner begin
          /o:"matth-s"
          /k:"matth-s_RessourceRelationnelle_BACKEND"
          /d:sonar.token="${{ secrets.SONAR_BACKEND }}"
          /d:sonar.host.url="https://sonarcloud.io"
          /d:sonar.cs.opencover.reportsPaths="coverage/**/coverage.opencover.xml"

      - name: Build
        run: dotnet build RessourceRelationnelle.API.sln --configuration Release

      - name: SonarQube End
        run: dotnet sonarscanner end /d:sonar.token="${{ secrets.SONAR_BACKEND }}"

  QualityFront:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./admin-frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: admin-front-coverage-report
          path: admin-frontend/coverage

      - name: SonarQube Scan
        uses: SonarSource/sonarcloud-github-action@v3.1.0
        with:
          projectBaseDir: ./admin-frontend
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_BACKOFFICE }}

  QualityMobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./mobile-app

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: mobile-coverage-report
          path: mobile-app/coverage

      - name: SonarQube Scan
        uses: SonarSource/sonarcloud-github-action@v3.1.0
        with:
          projectBaseDir: ./mobile-app
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_MOBILE }}
