name: 01-1 - Integration - TEST

on:
  workflow_call:

jobs:
  Backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test -d test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=127.0.0.1;Port=5432;Database=test;Username=test;Password=test;Include Error Detail=true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Database Cnx Check
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          PGPASSWORD=test psql --host 127.0.0.1 --port 5432 --username test --dbname test --command "\l"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore dependencies
        run: dotnet restore RessourceRelationnelle.API.sln

      - name: Build
        run: dotnet build RessourceRelationnelle.API.sln --configuration Release --no-restore

      - name: Run all test and coverage
        run: dotnet test RessourceRelationnelle.API.sln --configuration Release --no-build --collect:"XPlat Code Coverage" --results-directory coverage

      - name: Upload Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: back-coverage-report
          path: backend/coverage
          retention-days: 1

  AdminFrontend:
    needs: [Backend]
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test -d test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://127.0.0.1:5000
      ConnectionStrings__DefaultConnection: Host=127.0.0.1;Port=5432;Database=test;Username=test;Password=test;Include Error Detail=true
      VITE_PUBLIC_API_ROUTE: http://127.0.0.1:5000/api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Build backend
        working-directory: backend
        run: dotnet build RessourceRelationnelle.API.sln --configuration Release

      - name: Start backend
        working-directory: backend
        run: |
          nohup dotnet run --configuration Release --no-build --no-launch-profile --project RessourceRelationnelle.API/RessourceRelationnelle.API.csproj -- --urls http://127.0.0.1:5000 > backend.log 2>&1 &

      - name: Test Backend
        run: curl --fail --retry 12 --retry-delay 5 --retry-connrefused http://127.0.0.1:5000/swagger/index.html

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
          cache-dependency-path: admin-frontend/package-lock.json

      - name: Install dependencies
        working-directory: admin-frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: admin-frontend
        run: npx playwright install --with-deps

      - name: Run unit tests and coverage
        working-directory: admin-frontend
        run: npm run test:coverage

      - name: Start frontend
        working-directory: admin-frontend
        run: |
          nohup npm run dev -- --host 127.0.0.1 > frontend.log 2>&1 &

      - name: Test Frontend
        run: curl --fail --retry 12 --retry-delay 5 --retry-connrefused http://127.0.0.1:5173

      - name: Run E2E tests
        working-directory: admin-frontend
        run: npm run test:e2e

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-playwright-report
          path: admin-frontend/playwright-report
          retention-days: 1

      - name: Upload Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: admin-front-coverage-report
          path: admin-frontend/coverage
          retention-days: 1

  MobileApp:
    needs: [Backend]
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test -d test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://127.0.0.1:5000
      ConnectionStrings__DefaultConnection: Host=127.0.0.1;Port=5432;Database=test;Username=test;Password=test;Include Error Detail=true
      VITE_API_URL: http://127.0.0.1:5000/api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Build backend
        working-directory: backend
        run: dotnet build RessourceRelationnelle.API.sln --configuration Release

      - name: Start backend
        working-directory: backend
        run: |
          nohup dotnet run --configuration Release --no-build --no-launch-profile --project RessourceRelationnelle.API/RessourceRelationnelle.API.csproj -- --urls http://127.0.0.1:5000 > backend.log 2>&1 &

      - name: Test Backend
        run: curl --fail --retry 12 --retry-delay 5 --retry-connrefused http://127.0.0.1:5000/swagger/index.html

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
          cache-dependency-path: mobile-app/package-lock.json

      - name: Install dependencies
        working-directory: mobile-app
        run: npm ci

      - name: Install Playwright browsers
        working-directory: mobile-app
        run: npx playwright install --with-deps

      - name: Run unit tests and coverage
        working-directory: mobile-app
        run: npm run test:coverage

      - name: Run E2E tests
        working-directory: mobile-app
        run: npm run test:e2e

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-playwright-report
          path: mobile-app/playwright-report
          retention-days: 1

      - name: Upload Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobile-coverage-report
          path: mobile-app/coverage
          retention-days: 1
