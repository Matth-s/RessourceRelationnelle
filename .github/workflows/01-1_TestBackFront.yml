  AdminFrontend:
    runs-on: ubuntu-latest

    env:
      VITE_PUBLIC_API_ROUTE: http://217.154.113.110:8080/api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
          cache-dependency-path: admin-frontend/package-lock.json

      - name: Install dependencies
        working-directory: admin-frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: admin-frontend
        run: npx playwright install --with-deps

      - name: Run unit tests and coverage
        working-directory: admin-frontend
        run: npm run test:coverage

      - name: Fix coverage paths for Sonar
        working-directory: admin-frontend
        run: sed -i 's|SF:'$(pwd)'/|SF:|g' coverage/lcov.info

      - name: Upload Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: admin-front-coverage-report
          path: admin-frontend/coverage
          retention-days: 1

      - name: Start frontend
        working-directory: admin-frontend
        run: |
          nohup npm run dev -- --host 127.0.0.1 > frontend.log 2>&1 &

      - name: Test Frontend
        run: curl --fail --retry 12 --retry-delay 5 --retry-connrefused http://127.0.0.1:5173

      - name: Run E2E tests
        working-directory: admin-frontend
        run: npm run test:e2e

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-playwright-report
          path: admin-frontend/playwright-report
          retention-days: 1

  MobileApp:
    runs-on: ubuntu-latest

    env:
      VITE_API_URL: http://217.154.113.110:8080/api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
