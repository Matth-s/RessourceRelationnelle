name: Deploiement Automatique Backend

# on:
#   push:
#     branches: ['main']
#     paths:
#       - 'backend/**'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Connexion SSH et Mise a jour du serveur
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: JWT_PRIVATE_KEY,JWT_PUBLIC_KEY
          script: |
            set -e

            cd /var/www/ressource-api

            git fetch origin main
            git reset --hard origin/main
            git clean -fd

            echo "Libération de l'espace disque sur le serveur..."
            docker system prune -f

            # Écriture des clés RSA dans un fichier .env (non commité)
            cat > .env <<EOF
            JWT__PrivateKey=${JWT_PRIVATE_KEY}
            JWT__PublicKey=${JWT_PUBLIC_KEY}
            EOF

            docker compose up -d --build mon-api

            cd /var/www/cesizen-api/backend/
            docker compose -p cesizen up -d
        env:
          JWT_PRIVATE_KEY: ${{ secrets.JWT_PRIVATE_KEY }}
          JWT_PUBLIC_KEY: ${{ secrets.JWT_PUBLIC_KEY }}
