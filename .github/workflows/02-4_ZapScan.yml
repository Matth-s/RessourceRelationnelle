name: 02-4 - Delivery - ZAP Scan

on:
  workflow_call:
    inputs:
      target-host:
        description: "Hote de la VM de staging : IP publique ou FQDN (ex: 20.111.40.126)"
        required: true
        type: string

jobs:
  Back_Zap_Scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write   # les actions ZAP ouvrent une issue avec le rapport

    steps:
      - name: Checkout (pour lire le fichier de regles ZAP)
        uses: actions/checkout@v4

      - name: Run ZAP API Scan (back)
        uses: zaproxy/action-api-scan@v0.9.0
        with:
          format: openapi
          target: 'http://${{ inputs.target-host }}:12000/swagger/v1/swagger.json'
          fail_action: true
          rules_file_name: '.zap/rules-back.tsv'
          artifact_name: 'back_zap_scan'
          issue_title: 'ZAP Back Scan Report'

  Front_Zap_Scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout (pour lire le fichier de regles ZAP)
        uses: actions/checkout@v4

      - name: Run ZAP Baseline Scan (front)
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: 'http://${{ inputs.target-host }}'
          fail_action: true
          rules_file_name: '.zap/rules-front.tsv'
          artifact_name: 'front_zap_scan'
          issue_title: 'ZAP Front Scan Report'

  Mobile_Zap_Scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout (pour lire le fichier de regles ZAP)
        uses: actions/checkout@v4

      - name: Run ZAP Baseline Scan (mobile)
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: 'http://${{ inputs.target-host }}:81'
          fail_action: true
          rules_file_name: '.zap/rules-mobile.tsv'
          artifact_name: 'mobile_zap_scan'
          issue_title: 'ZAP Mobile Scan Report'
